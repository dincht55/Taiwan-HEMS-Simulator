# =====================================================================
# HEMS 模擬器設定檔（單一設定來源）
# 由 config.py 的 load_config() 讀入；鍵名大小寫不拘，數值即覆寫內建預設。
# 💡 換地區：執行 `python setup_config.py` 自動查座標/氣候並寫回此檔（見 README）。
# ⚠️ 電價費率與建置單價會變動（台電約每年 4、10 月調整），僅為參考值，
#    正式分析請向台電官網確認當期數字。結果為決策參考、非投資建議。
# 範例位置為高雄市前鎮區；以下數值皆為「台灣住宅情境」參考起點。
# =====================================================================

[location]
# 高雄市前鎮區（中央氣象署「高雄」測站 467441 一帶）
HEMS_LATITUDE  = 22.5655
HEMS_LONGITUDE = 120.3157
HEMS_TIMEZONE  = Asia/Taipei
HEMS_ALTITUDE  = 2.3

[pv]
PV_CAPACITY_KWP = 5.0
PV_TILT_DEG     = 23.5
PV_AZIMUTH_DEG  = 180.0
PV_SYSTEM_LOSS  = 0.14
PV_INVERTER_EFF = 0.96
PV_GAMMA_PDC    = -0.004
PV_NOCT_C       = 45.0
# 耦合架構：dc（預設，充電乘1次效率）或 ac（額外乘電池逆變器效率）
PV_COUPLING       = dc
BATT_INVERTER_EFF = 0.96

[battery]
BATT_CAPACITY_KWH     = 10.0
BATT_SOC_MIN          = 0.10
BATT_SOC_MAX          = 0.95
BATT_MAX_CHARGE_KW    = 5.0
BATT_MAX_DISCHARGE_KW = 5.0
BATT_CHARGE_EFF       = 0.95
BATT_DISCHARGE_EFF    = 0.95
BATT_DEGRADATION_COST = 1.5

[tariff]
# 電費類型：progressive(一般式) / two_stage(二段式) / three_stage(三段式)
TARIFF_SCHEME    = three_stage
TARIFF_BASIC_FEE = 75.0
# 本次模擬「實際」售電價（元/度）：
#   0  = 自用型，未登記躉售（餘電限發 curtail）。← 多數住宅、與既有結論一致的預設
#   >0 = 已登記自發自用餘電躉售，餘電以此價賣台電（dispatch 自動改饋網）。
TARIFF_SELL_PRICE = 0.0
# 躉購(FiT)參考價（元/度）：feedin 模式用來評估「若去登記躉售會如何」。
# 能源署 115 年度(2026) 屋頂型「10 瓩以下」= 5.6279 元/度（全年沿用 114 下半年）。
#   ⚠️ 躉售須向台電登記發電設備、簽 20 年購售電合約、加裝電表，可能有併網工程費；
#      費率逐年公告，正式分析請向能源署/台電確認當期值。
TARIFF_FEED_IN_PRICE = 5.6279
TARIFF_PEAK      = 7.13
TARIFF_MID       = 4.69
TARIFF_OFFPEAK   = 2.06

[economics]
PV_UNIT_COST_PER_KWP   = 50000.0
BATT_UNIT_COST_PER_KWH = 18000.0
SUBSIDY_TOTAL          = 0.0

[simulation]
SIM_TIMESTEP_MIN     = 15
SIM_START_DATE       = 2025-01-01
SIM_DAYS             = 365
# 控制策略：rule_based / rule_based_forecast / milp_mpc
SIM_CONTROL_STRATEGY = rule_based_forecast
LOAD_PROFILE_CSV     = data/load_profile.csv
# 合成負載等級（CSV 存在時忽略）：medium（約 600 度/月）/ high（約 950 度/月）
LOAD_LEVEL           = high

[dispatch]
# 充電哲學：load_first（PV 先供電、餘電才充電）/ battery_first（日照時 PV 先充滿再供電）
CHARGE_PRIORITY           = load_first
# 離峰用市電補電池目標 SOC（≤SOC_min=關閉；預測式策略會逐日自動設定）
OFFPEAK_CHARGE_TARGET_SOC = 0.0
# 智慧放電（衰減成本閘＋尖峰保留）；預測式策略會自動啟用
SMART_DISCHARGE           = false
MID_DISCHARGE_RESERVE_SOC = 0.0
# 只在最貴時段（尖峰）放電，半尖峰完全保留電量給尖峰
DISCHARGE_ONLY_PEAK       = false

# =====================================================================
# 執行設定（供 main.py 讀取；不屬於物理模型參數）
# =====================================================================
[run]
# 模式：single（單次模擬）/ sweep（容量掃描）/ tariff（電費方案比較）/ compare（策略比較）/ feedin（餘電躉售，不加電池）
MODE = single
# 多核心並行數（容量掃描用）；auto = 自動取 CPU 邏輯核心數（你的機器約 128）
N_JOBS = auto
# 啟用 numba JIT 加速（需安裝 numba；否則自動退回純 Python）
USE_JIT = true
# 預測式策略的天氣預報誤差（0=完美預報；0.15=±15%）
FORECAST_ERROR_STD = 0.0
# 輸出資料夾
OUTPUT_DIR = output
# 容量掃描網格（逗號分隔）：PV 容量(kWp) 與 電池容量(kWh)
SWEEP_PV_KWP   = 1, 2, 3, 5, 8
SWEEP_BATT_KWH = 0.001, 5, 10, 15

# 大型因子實驗（mode=factorial）：電費 × 負載 × PV × 電池 × 策略 全組合
FACTORIAL_TARIFF     = three_stage, two_stage, progressive
FACTORIAL_LOAD       = medium, high
FACTORIAL_PV_KWP     = 0.5, 1, 2, 3
FACTORIAL_BATT_KWH   = 1, 3, 5, 8
# 策略名（見 main.py _STRATEGIES）：
#   battery_first_peak = 日照PV先充滿再供電 + 只在尖峰放電 + 預測
#   load_first_peak    = PV先供電餘電再充 + 只在尖峰放電 + 預測
#   load_first_forecast= PV先供電餘電再充 + 預測（半尖峰也可放電）
FACTORIAL_STRATEGIES = battery_first_peak, load_first_peak
